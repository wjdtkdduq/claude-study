<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo v2</title>
  <style>
    /* ===== CSS 커스텀 프로퍼티 (디자인 토큰) ===== */
    :root {
      --color-bg:          #0a0a0f;
      --color-accent:      #5b40ff;
      --color-accent-alt:  #7c3aed;
      --color-card:        rgba(16, 16, 26, 0.95);
      --border-card:       1px solid rgba(255,255,255,0.07);
      --radius-sm:         12px;
      --radius-lg:         20px;
      --font-base:         -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;

      /* 우선순위 색상 */
      --color-priority-high:   #ff453a;
      --color-priority-medium: #ff9f0a;
      --color-priority-low:    #34c759;

      /* 태그 색상 */
      --color-tag-work:   #5b40ff;
      --color-tag-personal: #0a84ff;
      --color-tag-study:  #ff9f0a;
      --color-tag-other:  #8e8e93;

      /* D-Day 색상 */
      --color-dday-today:   #ffd60a;
      --color-dday-future:  #636366;
      --color-dday-overdue: #ff453a;

      /* 중요도 색상 */
      --color-importance-critical: #ff9f0a;
      --color-importance-minor:    #636366;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--color-bg);
      font-family: var(--font-base);
      padding: 40px 16px;
    }

    /* 배경 광원 효과 */
    body::before {
      content: '';
      position: fixed;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(91, 64, 255, 0.07) 0%, transparent 70%);
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== 레이아웃 ===== */
    .container {
      width: 560px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      background: var(--color-card);
      border: var(--border-card);
      border-radius: var(--radius-lg);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 32px 80px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    /* 상단 광선 효과 */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(91,64,255,0.8), transparent);
    }

    /* ===== 컴포넌트: 헤더 ===== */
    .header {
      padding: 24px 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-icon {
      width: 28px;
      height: 28px;
      background: rgba(91,64,255,0.15);
      border: 1px solid rgba(91,64,255,0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .title-icon svg {
      width: 14px;
      height: 14px;
      stroke: rgba(161,140,255,0.9);
    }

    /* 헤더 통계 뱃지 */
    .header-stats {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }

    .stat-badge--overdue {
      background: rgba(255,69,58,0.12);
      color: rgba(255,69,58,0.85);
      border: 1px solid rgba(255,69,58,0.2);
    }

    .stat-badge--today {
      background: rgba(255,214,10,0.1);
      color: rgba(255,214,10,0.8);
      border: 1px solid rgba(255,214,10,0.2);
    }

    .stat-badge--count {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.07);
    }

    /* ===== 컴포넌트: 진행률 바 ===== */
    .progress-section {
      margin-bottom: 16px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-label {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1px;
    }

    .progress-pct {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      letter-spacing: -0.2px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--color-accent), var(--color-accent-alt));
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 0;
    }

    /* ===== 컴포넌트: 입력 영역 ===== */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 텍스트 입력 줄 */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-row:focus-within {
      border-color: rgba(91,64,255,0.45);
      box-shadow: 0 0 0 3px rgba(91,64,255,0.1);
    }

    .input-row svg {
      width: 15px;
      height: 15px;
      stroke: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    #todo-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-family: inherit;
      padding: 12px 0;
      letter-spacing: -0.1px;
    }

    #todo-input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    /* 추가 버튼 */
    .add-btn {
      background: rgba(91,64,255,0.15);
      border: 1px solid rgba(91,64,255,0.3);
      color: rgba(161,140,255,0.9);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .add-btn:hover {
      background: rgba(91,64,255,0.25);
      border-color: rgba(91,64,255,0.5);
    }

    /* 옵션 줄: 우선순위 + 태그 + 날짜 */
    .options-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 우선순위 버튼 그룹 */
    .priority-group {
      display: flex;
      gap: 4px;
    }

    .priority-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.4);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.1px;
    }

    .priority-btn:hover {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.6);
    }

    /* 우선순위 활성 상태 */
    .priority-btn[data-priority="high"].active {
      background: rgba(255,69,58,0.15);
      border-color: rgba(255,69,58,0.3);
      color: var(--color-priority-high);
    }

    .priority-btn[data-priority="medium"].active {
      background: rgba(255,159,10,0.15);
      border-color: rgba(255,159,10,0.3);
      color: var(--color-priority-medium);
    }

    .priority-btn[data-priority="low"].active {
      background: rgba(52,199,89,0.15);
      border-color: rgba(52,199,89,0.3);
      color: var(--color-priority-low);
    }

    /* 중요도 버튼 그룹 */
    .importance-group {
      display: flex;
      gap: 4px;
    }

    .importance-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.4);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.1px;
    }

    .importance-btn:hover {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.6);
    }

    /* 중요도 활성 상태 */
    .importance-btn[data-importance="critical"].active {
      background: rgba(255,159,10,0.15);
      border-color: rgba(255,159,10,0.3);
      color: var(--color-importance-critical);
    }

    .importance-btn[data-importance="normal"].active {
      background: rgba(91,64,255,0.12);
      border-color: rgba(91,64,255,0.2);
      color: rgba(161,140,255,0.9);
    }

    .importance-btn[data-importance="minor"].active {
      background: rgba(99,99,102,0.12);
      border-color: rgba(99,99,102,0.2);
      color: var(--color-importance-minor);
    }

    /* 중요도 뱃지 (critical만 표시) */
    .importance-badge--critical {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.2px;
      background: rgba(255,159,10,0.15);
      color: var(--color-importance-critical);
      border: 1px solid rgba(255,159,10,0.25);
    }

    /* 중요도 필터 활성 색상 */
    .filter-btn[data-importance="critical"].active {
      background: rgba(255,159,10,0.12);
      border-color: rgba(255,159,10,0.25);
      color: #ffb340;
    }

    /* 태그 셀렉트 */
    .tag-select,
    .date-input {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
      height: 28px;
    }

    .tag-select:focus,
    .date-input:focus {
      border-color: rgba(91,64,255,0.4);
    }

    .tag-select option {
      background: #1a1a2e;
      color: rgba(255,255,255,0.8);
    }

    /* date 인풋 다크 테마 */
    .date-input {
      color-scheme: dark;
      /* 빈 값일 때 플레이스홀더처럼 보이게 */
    }

    .date-input::-webkit-calendar-picker-indicator {
      filter: invert(0.4);
      cursor: pointer;
    }

    /* ===== 컴포넌트: 검색 + 필터 바 ===== */
    .filter-bar {
      padding: 12px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 검색창 */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 0 12px;
      transition: border-color 0.15s;
    }

    .search-wrap:focus-within {
      border-color: rgba(91,64,255,0.35);
    }

    .search-wrap svg {
      width: 13px;
      height: 13px;
      stroke: rgba(255,255,255,0.25);
      flex-shrink: 0;
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-family: inherit;
      padding: 8px 0;
    }

    #search-input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    /* 검색 초기화 버튼 */
    .search-clear {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 4px;
      transition: color 0.15s;
      opacity: 0;
      pointer-events: none;
    }

    .search-clear.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .search-clear:hover {
      color: rgba(255,255,255,0.5);
    }

    .search-clear svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
    }

    /* 필터 버튼 줄 */
    .filter-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: none;
      border: 1px solid transparent;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.1px;
    }

    .filter-btn:hover {
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.04);
    }

    .filter-btn.active {
      background: rgba(91,64,255,0.12);
      border-color: rgba(91,64,255,0.2);
      color: rgba(161,140,255,0.9);
    }

    /* 태그 필터 활성 색상 */
    .filter-btn[data-tag="work"].active    { background: rgba(91,64,255,0.12); border-color: rgba(91,64,255,0.25); color: #a08cff; }
    .filter-btn[data-tag="personal"].active{ background: rgba(10,132,255,0.1); border-color: rgba(10,132,255,0.25); color: #64aaff; }
    .filter-btn[data-tag="study"].active   { background: rgba(255,159,10,0.1); border-color: rgba(255,159,10,0.25); color: #ffb340; }
    .filter-btn[data-tag="other"].active   { background: rgba(142,142,147,0.1); border-color: rgba(142,142,147,0.2); color: #aeaeb2; }

    /* 마감일 필터 버튼 활성 색상 */
    /* 오늘 마감 필터: 노란색 계열 */
    .filter-btn[data-duefilter="today"].active {
      background: rgba(255,214,10,0.1);
      border-color: rgba(255,214,10,0.25);
      color: #ffd60a;
    }

    /* 기한 초과 필터: 빨간색 계열 */
    .filter-btn[data-duefilter="overdue"].active {
      background: rgba(255,69,58,0.12);
      border-color: rgba(255,69,58,0.25);
      color: #ff453a;
    }

    /* 필터 구분선 */
    .filter-divider {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.08);
      margin: auto 2px;
    }

    /* ===== 컴포넌트: 할일 목록 ===== */
    .todo-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
      min-height: 80px;
    }

    .todo-list::-webkit-scrollbar {
      width: 4px;
    }

    .todo-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
    }

    /* ===== 컴포넌트: 빈 상태 ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px 0;
      color: rgba(255,255,255,0.18);
    }

    .empty-state svg {
      width: 30px;
      height: 30px;
      stroke: rgba(255,255,255,0.1);
    }

    .empty-state p {
      font-size: 13px;
      letter-spacing: -0.1px;
    }

    /* ===== 컴포넌트: 할일 아이템 ===== */
    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: all 0.15s;
      animation: slideIn 0.18s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.05);
    }

    /* 체크박스 */
    .checkbox {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      background: transparent;
      margin-top: 1px;
    }

    .checkbox:hover {
      border-color: rgba(91,64,255,0.5);
      background: rgba(91,64,255,0.08);
    }

    .checkbox.checked {
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-alt));
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(91,64,255,0.35);
    }

    .checkbox.checked svg {
      opacity: 1;
    }

    .checkbox svg {
      width: 10px;
      height: 10px;
      stroke: white;
      stroke-width: 2.5;
      opacity: 0;
      transition: opacity 0.1s;
    }

    /* 할일 본문 (텍스트 + 메타) */
    .todo-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .todo-text {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      letter-spacing: -0.1px;
      line-height: 1.4;
      word-break: break-word;
      transition: color 0.2s;
    }

    .todo-text.done {
      color: rgba(255,255,255,0.25);
      text-decoration: line-through;
      text-decoration-color: rgba(255,255,255,0.15);
    }

    /* 검색 하이라이트 */
    .todo-text mark {
      background: rgba(255,214,10,0.25);
      color: rgba(255,214,10,0.95);
      border-radius: 3px;
      padding: 0 1px;
    }

    /* 메타 줄 (우선순위 바 + 태그 + D-Day) */
    .todo-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* 우선순위 인디케이터 (컬러 바) */
    .priority-bar {
      width: 3px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 2px;
    }

    .priority-bar--high   { background: var(--color-priority-high); }
    .priority-bar--medium { background: var(--color-priority-medium); }
    .priority-bar--low    { background: var(--color-priority-low); }

    /* 태그 뱃지 */
    .tag-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }

    .tag-badge--work     { background: rgba(91,64,255,0.15);   color: #a08cff; border: 1px solid rgba(91,64,255,0.2); }
    .tag-badge--personal { background: rgba(10,132,255,0.12);  color: #64aaff; border: 1px solid rgba(10,132,255,0.2); }
    .tag-badge--study    { background: rgba(255,159,10,0.12);  color: #ffb340; border: 1px solid rgba(255,159,10,0.2); }
    .tag-badge--other    { background: rgba(142,142,147,0.1);  color: #aeaeb2; border: 1px solid rgba(142,142,147,0.15); }

    /* D-Day 뱃지 */
    .dday-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .dday-badge--today   { background: rgba(255,214,10,0.15); color: var(--color-dday-today);  border: 1px solid rgba(255,214,10,0.25); }
    .dday-badge--future  { background: rgba(99,99,102,0.15);  color: var(--color-dday-future); border: 1px solid rgba(99,99,102,0.2); }
    .dday-badge--overdue { background: rgba(255,69,58,0.15);  color: var(--color-dday-overdue); border: 1px solid rgba(255,69,58,0.25); }

    /* ===== 마감일 편집 버튼 ===== */

    /* 연필 아이콘 버튼 (D-Day 뱃지 옆, 호버 시 노출) */
    .dday-edit-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      color: rgba(255,255,255,0.25);
      display: inline-flex;
      align-items: center;
      opacity: 0;               /* 기본: 숨김 */
      transition: opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    /* 마감일 추가 버튼 (마감일 없는 항목, 호버 시 노출) */
    .dday-add-btn {
      background: none;
      border: 1px dashed rgba(255,255,255,0.12);
      cursor: pointer;
      padding: 1px 8px;
      border-radius: 6px;
      color: rgba(255,255,255,0.25);
      font-size: 10px;
      font-family: inherit;
      font-weight: 500;
      opacity: 0;               /* 기본: 숨김 */
      transition: opacity 0.15s, border-color 0.15s, color 0.15s;
    }

    /* 할일 아이템 호버 시 편집/추가 버튼 노출 */
    .todo-item:hover .dday-edit-btn,
    .todo-item:hover .dday-add-btn {
      opacity: 1;
    }

    .dday-edit-btn:hover {
      color: rgba(161,140,255,0.8);
    }

    .dday-add-btn:hover {
      color: rgba(161,140,255,0.7);
      border-color: rgba(91,64,255,0.3);
    }

    .dday-edit-btn svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
    }

    /* 인라인 날짜 편집 폼 */
    .dday-edit-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 인라인 날짜 입력창 */
    .date-input-inline {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(91,64,255,0.35);
      color: rgba(255,255,255,0.75);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      font-family: inherit;
      height: 22px;
      outline: none;
      color-scheme: dark;       /* 다크 모드 달력 아이콘 */
      transition: border-color 0.15s;
    }

    .date-input-inline:focus {
      border-color: rgba(91,64,255,0.6);
    }

    .date-input-inline::-webkit-calendar-picker-indicator {
      filter: invert(0.4);
      cursor: pointer;
      width: 10px;
      height: 10px;
    }

    /* 저장/취소 버튼 공통 */
    .dday-save-btn,
    .dday-cancel-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1;
      height: 22px;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }

    /* 저장 버튼: 초록 계열 */
    .dday-save-btn {
      color: rgba(52,199,89,0.8);
      border: 1px solid rgba(52,199,89,0.2);
    }

    .dday-save-btn:hover {
      background: rgba(52,199,89,0.1);
      color: rgba(52,199,89,1);
    }

    /* 취소 버튼: 흰색 계열 */
    .dday-cancel-btn {
      color: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .dday-cancel-btn:hover {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6);
    }

    /* ===== 기한 초과 항목 강조 ===== */

    /* 완료되지 않은 기한 초과 항목: 좌측 빨간 테두리 + 미묘한 배경 */
    .todo-item--overdue {
      background: rgba(255,69,58,0.03);
      border-left: 2px solid rgba(255,69,58,0.45) !important;
    }

    /* 기한 초과 항목 호버 시 강조 유지 */
    .todo-item--overdue:hover {
      background: rgba(255,69,58,0.06);
    }

    /* 기한 초과 항목의 D-Day 뱃지 더 강하게 표시 */
    .todo-item--overdue .dday-badge--overdue {
      background: rgba(255,69,58,0.25);
      color: #ff6b62;
      border-color: rgba(255,69,58,0.4);
    }

    /* 삭제 버튼 */
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.15s;
      color: rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    .todo-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: rgba(255,60,60,0.1);
      color: rgba(255,80,80,0.7);
    }

    .delete-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
    }

    /* ===== 컴포넌트: 완료 항목 섹션 ===== */
    .done-section {
      padding: 0 16px 8px;
    }

    .done-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 12px 10px;
      cursor: pointer;
      color: rgba(255,255,255,0.3);
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      letter-spacing: 0.1px;
      transition: color 0.15s;
      text-align: left;
    }

    .done-toggle:hover {
      color: rgba(255,255,255,0.5);
    }

    .done-toggle-arrow {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .done-toggle.expanded .done-toggle-arrow {
      transform: rotate(90deg);
    }

    .done-count-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.07);
      margin-left: auto;
    }

    .done-list {
      display: none;
      overflow: hidden;
    }

    .done-list.visible {
      display: block;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* 완료 아이템은 전체적으로 흐리게 */
    .done-list .todo-item {
      opacity: 0.55;
    }

    .done-list .todo-item:hover {
      opacity: 0.8;
    }

    /* ===== 컴포넌트: 푸터 ===== */
    .footer {
      padding: 12px 24px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-info {
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1px;
    }

    .clear-btn {
      background: none;
      border: none;
      font-size: 11px;
      font-family: inherit;
      color: rgba(255,80,80,0.4);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
      letter-spacing: 0.1px;
    }

    .clear-btn:hover {
      background: rgba(255,60,60,0.08);
      color: rgba(255,80,80,0.7);
    }

    .clear-btn:disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ===== 헤더 ===== -->
    <div class="header">
      <div class="header-top">
        <div class="title">
          <div class="title-icon">
            <!-- 체크리스트 아이콘 -->
            <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 12l2 2 4-4"/>
              <path d="M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
            </svg>
          </div>
          내 할일
        </div>
        <div class="header-stats">
          <!-- 마감 초과 경고 (JS에서 표시/숨김 제어) -->
          <span class="stat-badge stat-badge--overdue" id="overdue-badge" style="display:none"></span>
          <!-- 오늘 마감 알림 -->
          <span class="stat-badge stat-badge--today" id="today-badge" style="display:none"></span>
          <!-- 전체 카운트 -->
          <span class="stat-badge stat-badge--count" id="total-badge">0개</span>
        </div>
      </div>

      <!-- 진행률 바 -->
      <div class="progress-section">
        <div class="progress-meta">
          <span class="progress-label">진행률</span>
          <span class="progress-pct" id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
      </div>

      <!-- 할일 입력 섹션 -->
      <div class="input-section">
        <!-- 텍스트 입력 줄 -->
        <div class="input-row">
          <!-- 더하기 아이콘 -->
          <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <input type="text" id="todo-input" placeholder="새 할일 추가... (Enter로 등록)" maxlength="100" autocomplete="off" />
          <button class="add-btn" id="add-btn">추가</button>
        </div>

        <!-- 옵션 줄 -->
        <div class="options-row">
          <!-- 우선순위 토글 그룹 -->
          <div class="priority-group" id="priority-group">
            <button class="priority-btn active" data-priority="high">높음</button>
            <button class="priority-btn" data-priority="medium">보통</button>
            <button class="priority-btn" data-priority="low">낮음</button>
          </div>

          <!-- 태그 선택 -->
          <select class="tag-select" id="tag-select">
            <option value="">태그 없음</option>
            <option value="work">업무</option>
            <option value="personal">개인</option>
            <option value="study">공부</option>
            <option value="other">기타</option>
          </select>

          <!-- 마감일 선택 -->
          <input type="date" class="date-input" id="due-date-input" title="마감일 (선택사항)" />
        </div>

        <!-- 두 번째 옵션 줄: 중요도 -->
        <div class="options-row">
          <!-- 중요도 토글 그룹 -->
          <div class="importance-group" id="importance-group">
            <button class="importance-btn" data-importance="critical">중요</button>
            <button class="importance-btn active" data-importance="normal">보통</button>
            <button class="importance-btn" data-importance="minor">낮음</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 검색 + 필터 바 ===== -->
    <div class="filter-bar">
      <!-- 검색창 -->
      <div class="search-wrap">
        <!-- 돋보기 아이콘 -->
        <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="검색... (Esc로 초기화)" autocomplete="off" />
        <button class="search-clear" id="search-clear" title="검색 초기화">
          <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- 필터 버튼들 -->
      <div class="filter-row">
        <!-- 상태 필터 -->
        <button class="filter-btn active" data-status="all">전체</button>
        <button class="filter-btn" data-status="active">진행중</button>

        <div class="filter-divider"></div>

        <!-- 태그 필터 -->
        <button class="filter-btn" data-tag="work">업무</button>
        <button class="filter-btn" data-tag="personal">개인</button>
        <button class="filter-btn" data-tag="study">공부</button>
        <button class="filter-btn" data-tag="other">기타</button>

        <div class="filter-divider"></div>

        <!-- 중요도 필터 -->
        <button class="filter-btn" data-importance="critical">중요만</button>

        <div class="filter-divider"></div>

        <!-- 마감일 필터 -->
        <button class="filter-btn" data-duefilter="today">오늘 마감</button>
        <button class="filter-btn" data-duefilter="overdue">기한 초과</button>
      </div>
    </div>

    <!-- ===== 진행 중 할일 목록 ===== -->
    <div class="todo-list" id="todo-list"></div>

    <!-- ===== 완료 항목 섹션 ===== -->
    <div class="done-section" id="done-section">
      <button class="done-toggle" id="done-toggle">
        <!-- 화살표 아이콘 -->
        <svg class="done-toggle-arrow" fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        완료됨
        <span class="done-count-badge" id="done-count-badge">0</span>
      </button>
      <div class="done-list" id="done-list"></div>
    </div>

    <!-- ===== 푸터 ===== -->
    <div class="footer">
      <span class="footer-info" id="footer-info">할일을 추가해보세요</span>
      <button class="clear-btn" id="clear-btn" disabled>완료 항목 삭제</button>
    </div>

  </div>

  <script>
    // ============================================================
    // 1. 상수 및 설정
    // ============================================================

    /** localStorage 저장 키 */
    const STORAGE_KEY = 'linear-todos-v2';

    /** 우선순위 정렬 가중치 (낮을수록 먼저 표시) */
    const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };

    /** 우선순위 표시 레이블 */
    const PRIORITY_LABELS = { high: '높음', medium: '보통', low: '낮음' };

    /** 태그 표시 레이블 */
    const TAG_LABELS = { work: '업무', personal: '개인', study: '공부', other: '기타' };

    /** 중요도 표시 레이블 */
    const IMPORTANCE_LABELS = { critical: '중요', normal: '보통', minor: '낮음' };

    // ============================================================
    // 2. 상태 관리 (State Management)
    // ============================================================

    const State = {
      /** 전체 할일 배열 */
      todos: [],

      /** 현재 선택된 상태 필터 ('all' | 'active') */
      statusFilter: 'all',

      /** 현재 선택된 태그 필터 ('' | 'work' | 'personal' | 'study' | 'other') */
      tagFilter: '',

      /** 현재 검색어 */
      searchQuery: '',

      /** 완료 섹션 열림 여부 */
      doneExpanded: false,

      /** 새 할일 입력 우선순위 */
      inputPriority: 'high',

      /** 새 할일 입력 중요도 */
      inputImportance: 'normal',

      /** 중요도 필터 ('' | 'critical') — 중요만 보기 */
      importanceFilter: '',

      /** 마감일 필터 ('' | 'today' | 'overdue') */
      dueDateFilter: '',

      /** 현재 마감일 인라인 편집 중인 할일 ID (없으면 null) */
      editingDueDateId: null,
    };

    // ============================================================
    // 3. 저장소 추상화 (Repository Pattern)
    // ============================================================

    const Repository = {
      /** localStorage에서 할일 목록 불러오기 */
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          console.warn('저장 데이터 로드 실패:', e);
          return [];
        }
      },

      /** localStorage에 할일 목록 저장 */
      save(todos) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {
          console.warn('저장 실패:', e);
        }
      },
    };

    // ============================================================
    // 4. 비즈니스 로직 (Domain Logic - 순수 함수)
    // ============================================================

    const DomainService = {
      /**
       * 기존 저장 데이터에 importance 필드 보정 (마이그레이션)
       * importance 없는 항목은 'normal'로 자동 채워 멱등성 보장
       * @param {Array} todos - 불러온 원시 할일 배열
       * @returns {Array} importance 필드가 보장된 배열
       */
      migrate(todos) {
        return todos.map(t => ({ importance: 'normal', ...t }));
      },

      /**
       * 새 할일 객체 생성
       * @param {string} text - 할일 텍스트
       * @param {string} priority - 우선순위 ('high'|'medium'|'low')
       * @param {string} importance - 중요도 ('critical'|'normal'|'minor')
       * @param {string} tag - 태그 키
       * @param {string} dueDate - 마감일 (YYYY-MM-DD 문자열, 없으면 '')
       */
      createTodo(text, priority, importance, tag, dueDate) {
        return {
          id: Date.now(),
          text: text.trim(),
          done: false,
          priority: priority || 'medium',
          importance: importance || 'normal',
          tag: tag || '',
          dueDate: dueDate || '',
          createdAt: new Date().toISOString(),
        };
      },

      /**
       * 진행 중 할일만 우선순위 순으로 정렬하여 반환
       * 우선순위: 높음(0) → 보통(1) → 낮음(2)
       */
      sortActiveTodos(todos) {
        return [...todos]
          .filter(t => !t.done)
          .sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1));
      },

      /** 완료된 할일 반환 (최신 완료 순 유지) */
      getDoneTodos(todos) {
        return todos.filter(t => t.done);
      },

      /** 완료율 계산 (0~100 정수) */
      calcProgress(todos) {
        if (todos.length === 0) return 0;
        const done = todos.filter(t => t.done).length;
        return Math.round((done / todos.length) * 100);
      },

      /**
       * D-Day 정보 계산
       * @param {string} dueDate - YYYY-MM-DD 형식 문자열
       * @returns {{ label: string, type: 'today'|'future'|'overdue' }|null}
       */
      calcDDay(dueDate) {
        if (!dueDate) return null;
        // 시간대 오차 없이 날짜만 비교하기 위해 로컬 자정 기준으로 파싱
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(dueDate + 'T00:00:00');
        const diffMs = due - today;
        const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return { label: 'D-Day', type: 'today' };
        if (diffDays > 0)  return { label: `D-${diffDays}`, type: 'future' };
        return { label: `D+${Math.abs(diffDays)}`, type: 'overdue' };
      },

      /**
       * 오늘 마감 할일 수 반환
       */
      countTodayDue(todos) {
        return todos.filter(t => {
          if (t.done || !t.dueDate) return false;
          const d = DomainService.calcDDay(t.dueDate);
          return d && d.type === 'today';
        }).length;
      },

      /**
       * 마감 초과 할일 수 반환
       */
      countOverdue(todos) {
        return todos.filter(t => {
          if (t.done || !t.dueDate) return false;
          const d = DomainService.calcDDay(t.dueDate);
          return d && d.type === 'overdue';
        }).length;
      },

      /**
       * 마감일 업데이트 — 불변성 유지를 위해 새 배열 반환
       * @param {Array} todos - 전체 할일 배열
       * @param {number} id - 수정할 할일 ID
       * @param {string} newDueDate - 새 마감일 (YYYY-MM-DD, 빈 문자열이면 마감일 삭제)
       * @returns {Array} 수정된 새 배열
       */
      updateDueDate(todos, id, newDueDate) {
        return todos.map(t =>
          t.id === id ? { ...t, dueDate: newDueDate } : t
        );
      },

      /**
       * 필터 및 검색 적용
       * @param {Array} todos - 필터링할 할일 배열 (이미 정렬된 진행중 or 완료)
       * @param {string} statusFilter - 상태 필터
       * @param {string} tagFilter - 태그 필터
       * @param {string} searchQuery - 검색어
       * @param {string} importanceFilter - 중요도 필터 ('' | 'critical')
       * @param {string} dueDateFilter - 마감일 필터 ('' | 'today' | 'overdue')
       */
      applyFilters(todos, statusFilter, tagFilter, searchQuery, importanceFilter, dueDateFilter) {
        let result = todos;

        // 태그 필터 적용
        if (tagFilter) {
          result = result.filter(t => t.tag === tagFilter);
        }

        // 중요도 필터 적용 — 'critical'이면 중요 항목만 표시
        if (importanceFilter) {
          result = result.filter(t => t.importance === importanceFilter);
        }

        // 마감일 필터 적용 — 진행 중 항목에만 의미 있음 (완료 항목은 그대로 통과)
        if (dueDateFilter) {
          result = result.filter(t => {
            // 완료 항목은 마감일 필터 적용 안 함
            if (t.done) return false;
            if (!t.dueDate) return false;
            const d = DomainService.calcDDay(t.dueDate);
            if (!d) return false;
            if (dueDateFilter === 'today')   return d.type === 'today';
            if (dueDateFilter === 'overdue') return d.type === 'overdue';
            return true;
          });
        }

        // 검색어 필터 적용
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          result = result.filter(t => t.text.toLowerCase().includes(q));
        }

        return result;
      },

      /**
       * 검색어에 해당하는 텍스트를 <mark>로 감싼 HTML 반환
       * XSS 방지를 위해 escapeHtml 적용 후 하이라이트 처리
       */
      highlightText(text, query) {
        const escaped = DomainService.escapeHtml(text);
        if (!query) return escaped;
        const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return escaped.replace(
          new RegExp(safeQuery.replace(/[a-z]/gi, c => `[${c.toLowerCase()}${c.toUpperCase()}]`), 'gi'),
          match => `<mark>${match}</mark>`
        );
      },

      /** HTML 특수문자 이스케이프 (XSS 방지) */
      escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      },
    };

    // ============================================================
    // 5. UI 렌더링 (View Layer)
    // ============================================================

    const View = {
      /** DOM 요소 캐시 */
      els: {
        todoList:       document.getElementById('todo-list'),
        doneList:       document.getElementById('done-list'),
        doneSection:    document.getElementById('done-section'),
        doneToggle:     document.getElementById('done-toggle'),
        doneCountBadge: document.getElementById('done-count-badge'),
        progressBar:    document.getElementById('progress-bar'),
        progressPct:    document.getElementById('progress-pct'),
        totalBadge:     document.getElementById('total-badge'),
        overdueBadge:   document.getElementById('overdue-badge'),
        todayBadge:     document.getElementById('today-badge'),
        footerInfo:     document.getElementById('footer-info'),
        clearBtn:       document.getElementById('clear-btn'),
        todoInput:      document.getElementById('todo-input'),
        tagSelect:      document.getElementById('tag-select'),
        dueDateInput:   document.getElementById('due-date-input'),
        searchInput:    document.getElementById('search-input'),
        searchClear:    document.getElementById('search-clear'),
        priorityGroup:   document.getElementById('priority-group'),
        importanceGroup: document.getElementById('importance-group'),
      },

      /** 전체 화면 다시 그리기 */
      render(state) {
        const { todos, statusFilter, tagFilter, searchQuery, doneExpanded, importanceFilter, dueDateFilter } = state;
        const allActive = DomainService.sortActiveTodos(todos);
        const allDone   = DomainService.getDoneTodos(todos);

        // 진행 중 목록에 필터 적용 (마감일 필터 포함)
        const filteredActive = DomainService.applyFilters(allActive, statusFilter, tagFilter, searchQuery, importanceFilter, dueDateFilter);
        // 완료 목록에는 마감일 필터 적용 안 함 (완료 항목은 필터에서 제외됨)
        const filteredDone   = DomainService.applyFilters(allDone, statusFilter, tagFilter, searchQuery, importanceFilter, dueDateFilter);

        // 상태 필터가 'active'일 때는 완료 항목 숨김
        const showDone = statusFilter !== 'active';

        View.renderHeader(todos);
        View.renderActiveList(filteredActive, searchQuery, state.editingDueDateId);
        View.renderDoneSection(showDone ? filteredDone : [], allDone.length, doneExpanded);
        View.renderFooter(todos, allActive.length);
        // 마감일 필터 버튼 상태 반영
        View.updateFilterButtons(statusFilter, tagFilter, importanceFilter, dueDateFilter);
      },

      /** 헤더(진행률/뱃지) 업데이트 */
      renderHeader(todos) {
        const { els } = View;
        const total   = todos.length;
        const pct     = DomainService.calcProgress(todos);
        const overdue = DomainService.countOverdue(todos);
        const todayCnt = DomainService.countTodayDue(todos);

        // 진행률
        els.progressBar.style.width = pct + '%';
        els.progressPct.textContent = pct + '%';

        // 전체 카운트
        els.totalBadge.textContent = total + '개';

        // 마감 초과 뱃지
        if (overdue > 0) {
          els.overdueBadge.textContent = `초과 ${overdue}건`;
          els.overdueBadge.style.display = '';
        } else {
          els.overdueBadge.style.display = 'none';
        }

        // 오늘 마감 뱃지
        if (todayCnt > 0) {
          els.todayBadge.textContent = `오늘 마감 ${todayCnt}건`;
          els.todayBadge.style.display = '';
        } else {
          els.todayBadge.style.display = 'none';
        }
      },

      /** 진행 중 목록 렌더링 */
      renderActiveList(todos, searchQuery, editingDueDateId) {
        const { todoList } = View.els;
        if (todos.length === 0) {
          todoList.innerHTML = View.buildEmptyState(searchQuery ? '검색 결과가 없습니다' : '진행 중인 할일이 없습니다');
          return;
        }
        // DocumentFragment로 한 번에 삽입 (불필요한 리플로우 최소화)
        const frag = document.createDocumentFragment();
        const wrapper = document.createElement('div');
        wrapper.innerHTML = todos.map(t => View.buildTodoItem(t, searchQuery, false, editingDueDateId)).join('');
        while (wrapper.firstChild) frag.appendChild(wrapper.firstChild);
        todoList.innerHTML = '';
        todoList.appendChild(frag);
      },

      /** 완료 섹션 렌더링 */
      renderDoneSection(todos, totalDoneCount, expanded) {
        const { doneSection, doneToggle, doneCountBadge, doneList } = View.els;

        // 완료 항목이 전혀 없으면 섹션 숨김
        if (totalDoneCount === 0) {
          doneSection.style.display = 'none';
          return;
        }
        doneSection.style.display = '';

        doneCountBadge.textContent = totalDoneCount;

        // 토글 상태 반영
        if (expanded) {
          doneToggle.classList.add('expanded');
          doneList.classList.add('visible');
        } else {
          doneToggle.classList.remove('expanded');
          doneList.classList.remove('visible');
        }

        // 완료 목록 렌더링
        if (todos.length === 0) {
          doneList.innerHTML = View.buildEmptyState('필터 조건에 맞는 완료 항목이 없습니다');
        } else {
          const frag = document.createDocumentFragment();
          const wrapper = document.createElement('div');
          wrapper.innerHTML = todos.map(t => View.buildTodoItem(t, '', true)).join('');
          while (wrapper.firstChild) frag.appendChild(wrapper.firstChild);
          doneList.innerHTML = '';
          doneList.appendChild(frag);
        }
      },

      /** 푸터 업데이트 */
      renderFooter(todos, activeCount) {
        const { footerInfo, clearBtn } = View.els;
        const doneCount = todos.filter(t => t.done).length;

        if (todos.length === 0) {
          footerInfo.textContent = '할일을 추가해보세요';
        } else {
          footerInfo.textContent = `${activeCount}개 진행 중 · ${doneCount}개 완료`;
        }

        clearBtn.disabled = doneCount === 0;
      },

      /**
       * 할일 아이템 HTML 생성
       * @param {Object} todo - 할일 객체
       * @param {string} searchQuery - 하이라이트용 검색어
       * @param {boolean} isDone - 완료 아이템 여부
       * @param {number|null} editingDueDateId - 현재 마감일 편집 중인 할일 ID
       */
      buildTodoItem(todo, searchQuery, isDone, editingDueDateId) {
        const textHtml  = DomainService.highlightText(todo.text, searchQuery);
        const dday      = todo.dueDate ? DomainService.calcDDay(todo.dueDate) : null;

        // 기한 초과 여부 — 완료 항목에는 강조 적용 안 함
        const isOverdue = !isDone && dday && dday.type === 'overdue';

        // D-Day 영역 HTML — 편집 중이면 인라인 폼, 아니면 뱃지+연필 버튼
        let ddayAreaHtml = '';
        if (!isDone) {
          if (editingDueDateId === todo.id) {
            // 인라인 날짜 편집 폼 표시
            ddayAreaHtml = View.buildDayEditForm(todo.id, todo.dueDate);
          } else if (dday) {
            // D-Day 뱃지 + 연필 아이콘 버튼 (호버 시 노출)
            ddayAreaHtml = `
              <span class="dday-badge dday-badge--${dday.type}">${dday.label}</span>
              <button class="dday-edit-btn" data-action="open-dday-edit" data-id="${todo.id}" title="마감일 수정">
                <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>`;
          } else {
            // 마감일 없는 항목: '+ 마감일' 버튼 (호버 시 노출)
            ddayAreaHtml = `
              <button class="dday-add-btn" data-action="open-dday-edit" data-id="${todo.id}" title="마감일 추가">+ 마감일</button>`;
          }
        } else if (dday) {
          // 완료 항목은 뱃지만 표시 (편집 버튼 없음)
          ddayAreaHtml = `<span class="dday-badge dday-badge--${dday.type}">${dday.label}</span>`;
        }

        const tagHtml   = todo.tag
          ? `<span class="tag-badge tag-badge--${todo.tag}">${TAG_LABELS[todo.tag] || todo.tag}</span>`
          : '';

        // 중요도 뱃지: critical일 때만 표시 (노이즈 최소화)
        const importanceHtml = todo.importance === 'critical'
          ? `<span class="importance-badge--critical">${IMPORTANCE_LABELS.critical}</span>`
          : '';

        // 메타 행 내용이 있을 때만 렌더링
        const hasMetaContent = tagHtml || importanceHtml || ddayAreaHtml;

        return `
          <div class="todo-item${isOverdue ? ' todo-item--overdue' : ''}" data-id="${todo.id}">
            <div class="priority-bar priority-bar--${todo.priority}"></div>
            <div class="checkbox ${todo.done ? 'checked' : ''}" data-action="toggle" data-id="${todo.id}">
              <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div class="todo-body">
              <span class="todo-text ${todo.done ? 'done' : ''}">${textHtml}</span>
              ${hasMetaContent ? `<div class="todo-meta">${tagHtml}${importanceHtml}${ddayAreaHtml}</div>` : ''}
            </div>
            <button class="delete-btn" data-action="delete" data-id="${todo.id}" title="삭제">
              <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
              </svg>
            </button>
          </div>`;
      },

      /**
       * 마감일 인라인 편집 폼 HTML 생성
       * @param {number} id - 할일 ID
       * @param {string} currentDueDate - 현재 마감일 (YYYY-MM-DD, 없으면 '')
       */
      buildDayEditForm(id, currentDueDate) {
        return `
          <div class="dday-edit-wrap">
            <input
              type="date"
              class="date-input-inline"
              data-action="dday-date-input"
              data-id="${id}"
              value="${currentDueDate || ''}"
            />
            <button class="dday-save-btn" data-action="save-dday" data-id="${id}" title="저장">✓</button>
            <button class="dday-cancel-btn" data-action="cancel-dday" data-id="${id}" title="취소">✗</button>
          </div>`;
      },

      /**
       * 특정 할일의 마감일 영역을 인라인 편집 폼으로 교체 (전체 재렌더 없음)
       * @param {number} id - 편집할 할일 ID
       * @param {string} currentDueDate - 현재 마감일
       */
      openDayEdit(id, currentDueDate) {
        // 이미 열린 편집창이 있으면 먼저 닫기
        View.closeDayEdit();

        // 해당 할일 아이템의 todo-meta 안에서 D-Day 관련 요소 찾기
        const itemEl = document.querySelector(`.todo-item[data-id="${id}"]`);
        if (!itemEl) return;

        const metaEl = itemEl.querySelector('.todo-meta');

        // 메타 행이 없으면 새로 생성 (마감일 없고 태그도 없는 경우)
        if (!metaEl) {
          const bodyEl = itemEl.querySelector('.todo-body');
          const newMeta = document.createElement('div');
          newMeta.className = 'todo-meta';
          newMeta.innerHTML = View.buildDayEditForm(id, currentDueDate);
          bodyEl.appendChild(newMeta);
        } else {
          // 기존 메타 행에서 D-Day 뱃지 + 편집 버튼 / '+ 마감일' 버튼을 폼으로 교체
          const ddayBadge  = metaEl.querySelector('.dday-badge');
          const ddayEditBtn = metaEl.querySelector('.dday-edit-btn');
          const ddayAddBtn = metaEl.querySelector('.dday-add-btn');

          // 기존 D-Day 관련 요소 제거
          if (ddayBadge)   ddayBadge.remove();
          if (ddayEditBtn) ddayEditBtn.remove();
          if (ddayAddBtn)  ddayAddBtn.remove();

          // 인라인 편집 폼 삽입
          const wrap = document.createElement('div');
          wrap.innerHTML = View.buildDayEditForm(id, currentDueDate);
          // wrap의 첫 자식(.dday-edit-wrap)을 메타 행 끝에 추가
          while (wrap.firstChild) metaEl.appendChild(wrap.firstChild);
        }

        // setTimeout으로 포커스 — DOM 삽입 직후 focus 안 되는 타이밍 문제 방지
        setTimeout(() => {
          const input = document.querySelector(`.date-input-inline[data-id="${id}"]`);
          if (input) input.focus();
        }, 0);
      },

      /**
       * 인라인 편집 폼 닫기 — 전체 재렌더로 원상복구
       * State.editingDueDateId를 null로 초기화한 뒤 render 호출
       */
      closeDayEdit() {
        // 이미 편집 중인 폼이 없으면 무시
        const existing = document.querySelector('.dday-edit-wrap');
        if (!existing) return;
        // State 초기화는 Controller에서 담당하므로 여기서는 DOM만 정리
        // (Controller.handleSaveDueDate / handleCancelDueDate에서 State 초기화 후 render 호출)
      },

      /** 빈 상태 HTML 생성 */
      buildEmptyState(message) {
        return `
          <div class="empty-state">
            <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <p>${DomainService.escapeHtml(message)}</p>
          </div>`;
      },

      /** 우선순위 버튼 활성 상태 업데이트 */
      updatePriorityButtons(priority) {
        View.els.priorityGroup.querySelectorAll('.priority-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.priority === priority);
        });
      },

      /** 중요도 버튼 활성 상태 업데이트 */
      updateImportanceButtons(importance) {
        View.els.importanceGroup.querySelectorAll('.importance-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.importance === importance);
        });
      },

      /** 필터 버튼 활성 상태 업데이트 */
      updateFilterButtons(statusFilter, tagFilter, importanceFilter, dueDateFilter) {
        // 상태 필터
        document.querySelectorAll('[data-status]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.status === statusFilter);
        });
        // 태그 필터 (빈 문자열이면 모두 비활성)
        document.querySelectorAll('[data-tag]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tag === tagFilter);
        });
        // 중요도 필터 — 빈 문자열이면 비활성
        document.querySelectorAll('[data-importance]').forEach(btn => {
          // importance-group 내부 버튼은 제외하고 filter-row 내 버튼만 대상으로 함
          if (btn.closest('.filter-row')) {
            btn.classList.toggle('active', btn.dataset.importance === importanceFilter && importanceFilter !== '');
          }
        });
        // 마감일 필터 — 빈 문자열이면 비활성
        document.querySelectorAll('[data-duefilter]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.duefilter === dueDateFilter && dueDateFilter !== '');
        });
      },

      /** 검색 초기화 버튼 표시 여부 업데이트 */
      updateSearchClear(query) {
        View.els.searchClear.classList.toggle('visible', query.length > 0);
      },
    };

    // ============================================================
    // 6. 컨트롤러 (Controller Layer)
    // ============================================================

    const Controller = {
      /** 앱 초기화 */
      init() {
        // 저장된 데이터 불러오기 + 마이그레이션 (importance 필드 자동 보정)
        State.todos = DomainService.migrate(Repository.load());

        // 이벤트 리스너 등록
        Controller.bindEvents();

        // 초기 렌더링
        View.render(State);
      },

      /** 이벤트 핸들러 등록 */
      bindEvents() {
        const { els } = View;

        // ---- 입력 관련 ----
        els.todoInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') Controller.handleAdd();
        });

        document.getElementById('add-btn').addEventListener('click', Controller.handleAdd);

        // 우선순위 버튼 그룹 (이벤트 위임)
        els.priorityGroup.addEventListener('click', e => {
          const btn = e.target.closest('.priority-btn');
          if (!btn) return;
          State.inputPriority = btn.dataset.priority;
          View.updatePriorityButtons(State.inputPriority);
        });

        // 중요도 버튼 그룹 (이벤트 위임)
        els.importanceGroup.addEventListener('click', e => {
          const btn = e.target.closest('.importance-btn');
          if (!btn) return;
          State.inputImportance = btn.dataset.importance;
          View.updateImportanceButtons(State.inputImportance);
        });

        // ---- 검색 ----
        els.searchInput.addEventListener('input', e => {
          State.searchQuery = e.target.value;
          View.updateSearchClear(State.searchQuery);
          View.render(State);
        });

        els.searchInput.addEventListener('keydown', e => {
          if (e.key === 'Escape') Controller.clearSearch();
        });

        els.searchClear.addEventListener('click', Controller.clearSearch);

        // ---- 필터 버튼들 (이벤트 위임) ----
        document.querySelector('.filter-row').addEventListener('click', e => {
          const btn = e.target.closest('.filter-btn');
          if (!btn) return;

          if (btn.dataset.status !== undefined) {
            // 상태 필터 토글
            State.statusFilter = btn.dataset.status;
          } else if (btn.dataset.tag !== undefined) {
            // 태그 필터 토글 (같은 버튼 다시 클릭하면 해제)
            State.tagFilter = (State.tagFilter === btn.dataset.tag) ? '' : btn.dataset.tag;
          } else if (btn.dataset.importance !== undefined) {
            // 중요도 필터 토글 (같은 버튼 다시 클릭하면 해제)
            State.importanceFilter = (State.importanceFilter === btn.dataset.importance) ? '' : btn.dataset.importance;
          } else if (btn.dataset.duefilter !== undefined) {
            // 마감일 필터 토글 (같은 버튼 다시 클릭하면 해제)
            State.dueDateFilter = (State.dueDateFilter === btn.dataset.duefilter) ? '' : btn.dataset.duefilter;
          }

          View.updateFilterButtons(State.statusFilter, State.tagFilter, State.importanceFilter, State.dueDateFilter);
          View.render(State);
        });

        // ---- 할일 목록 이벤트 위임 (진행중 + 완료) ----
        [els.todoList, els.doneList].forEach(listEl => {
          listEl.addEventListener('click', e => {
            const action = e.target.closest('[data-action]');
            if (!action) return;
            const id = parseInt(action.dataset.id, 10);

            switch (action.dataset.action) {
              case 'toggle':
                Controller.handleToggle(id);
                break;
              case 'delete':
                Controller.handleDelete(id);
                break;
              // 마감일 편집창 열기 (연필 버튼 or '+ 마감일' 버튼)
              case 'open-dday-edit': {
                const todo = State.todos.find(t => t.id === id);
                if (!todo) return;
                State.editingDueDateId = id;
                // 전체 재렌더 대신 해당 DOM만 교체
                View.openDayEdit(id, todo.dueDate || '');
                break;
              }
              // 마감일 저장 확인(✓) 버튼
              case 'save-dday': {
                // 인라인 input에서 값 읽기
                const input = document.querySelector(`.date-input-inline[data-id="${id}"]`);
                const newDueDate = input ? input.value : '';
                Controller.handleSaveDueDate(id, newDueDate);
                break;
              }
              // 마감일 편집 취소(✗) 버튼
              case 'cancel-dday':
                Controller.handleCancelDueDate();
                break;
            }
          });
        });

        // ---- 완료 섹션 토글 ----
        els.doneToggle.addEventListener('click', () => {
          State.doneExpanded = !State.doneExpanded;
          View.render(State);
        });

        // ---- 완료 항목 전체 삭제 ----
        els.clearBtn.addEventListener('click', () => {
          if (!confirm('완료된 모든 항목을 삭제할까요?')) return;
          State.todos = State.todos.filter(t => !t.done);
          State.doneExpanded = false;
          Controller.persist();
        });
      },

      /** 할일 추가 핸들러 */
      handleAdd() {
        const text       = View.els.todoInput.value.trim();
        const priority   = State.inputPriority;
        const importance = State.inputImportance;
        const tag        = View.els.tagSelect.value;
        const dueDate    = View.els.dueDateInput.value;

        // 유효성 검사
        if (!text) {
          View.els.todoInput.focus();
          return;
        }

        // 중요도를 포함한 새 할일 생성
        const newTodo = DomainService.createTodo(text, priority, importance, tag, dueDate);
        State.todos.unshift(newTodo);

        // 입력 초기화
        View.els.todoInput.value = '';
        View.els.todoInput.focus();

        Controller.persist();
      },

      /** 완료 토글 핸들러 */
      handleToggle(id) {
        const todo = State.todos.find(t => t.id === id);
        if (!todo) return;
        todo.done = !todo.done;
        Controller.persist();
      },

      /** 삭제 핸들러 */
      handleDelete(id) {
        State.todos = State.todos.filter(t => t.id !== id);
        Controller.persist();
      },

      /**
       * 마감일 저장 핸들러
       * @param {number} id - 수정할 할일 ID
       * @param {string} newDueDate - 새 마감일 (YYYY-MM-DD, 빈 문자열이면 삭제)
       */
      handleSaveDueDate(id, newDueDate) {
        // DomainService를 통해 불변성 유지하며 배열 업데이트
        State.todos = DomainService.updateDueDate(State.todos, id, newDueDate);
        // 편집 상태 초기화
        State.editingDueDateId = null;
        Controller.persist();
      },

      /**
       * 마감일 편집 취소 핸들러
       * 상태만 초기화하고 재렌더 (데이터 변경 없음)
       */
      handleCancelDueDate() {
        State.editingDueDateId = null;
        View.render(State);
      },

      /** 검색 초기화 */
      clearSearch() {
        State.searchQuery = '';
        View.els.searchInput.value = '';
        View.updateSearchClear('');
        View.render(State);
        View.els.searchInput.focus();
      },

      /** 상태 저장 + 렌더링 */
      persist() {
        Repository.save(State.todos);
        View.render(State);
      },
    };

    // ============================================================
    // 7. 앱 시작
    // ============================================================
    Controller.init();
  </script>
</body>
</html>
