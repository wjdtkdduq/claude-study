<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(91, 64, 255, 0.1) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      width: 480px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      background: rgba(16, 16, 26, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 32px 80px rgba(0, 0, 0, 0.6),
        0 8px 24px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(91, 64, 255, 0.8), transparent);
    }

    /* Header */
    .header {
      padding: 28px 28px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .title {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-icon {
      width: 28px;
      height: 28px;
      background: rgba(91, 64, 255, 0.15);
      border: 1px solid rgba(91, 64, 255, 0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-icon svg {
      width: 14px;
      height: 14px;
      stroke: rgba(139, 114, 255, 0.9);
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }

    .badge-total {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .badge-done {
      background: rgba(52, 199, 89, 0.1);
      color: rgba(52, 199, 89, 0.7);
      border: 1px solid rgba(52, 199, 89, 0.15);
    }

    /* Input */
    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 0 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrap:focus-within {
      border-color: rgba(91, 64, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(91, 64, 255, 0.1);
    }

    .input-wrap svg {
      width: 15px;
      height: 15px;
      stroke: rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    #todo-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-family: inherit;
      padding: 13px 0;
      letter-spacing: -0.1px;
    }

    #todo-input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .add-btn {
      background: rgba(91, 64, 255, 0.15);
      border: 1px solid rgba(91, 64, 255, 0.25);
      color: rgba(139, 114, 255, 0.9);
      border-radius: 8px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .add-btn:hover {
      background: rgba(91, 64, 255, 0.25);
      border-color: rgba(91, 64, 255, 0.4);
    }

    .add-btn svg {
      width: 14px;
      height: 14px;
      stroke: rgba(139, 114, 255, 0.9);
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 4px;
      padding: 16px 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .filter-btn {
      background: none;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.1px;
    }

    .filter-btn:hover {
      color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.04);
    }

    .filter-btn.active {
      background: rgba(91, 64, 255, 0.12);
      border-color: rgba(91, 64, 255, 0.2);
      color: rgba(139, 114, 255, 0.9);
    }

    /* Todo list */
    .todo-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
    }

    .todo-list::-webkit-scrollbar {
      width: 4px;
    }

    .todo-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 48px 0;
      color: rgba(255, 255, 255, 0.18);
    }

    .empty svg {
      width: 32px;
      height: 32px;
      stroke: rgba(255, 255, 255, 0.1);
    }

    .empty p {
      font-size: 13px;
      letter-spacing: -0.1px;
    }

    /* Todo item */
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: all 0.15s;
      cursor: default;
      animation: slideIn 0.2s ease-out;
      group: '';
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.05);
    }

    /* Checkbox */
    .checkbox {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      background: transparent;
    }

    .checkbox:hover {
      border-color: rgba(91, 64, 255, 0.5);
      background: rgba(91, 64, 255, 0.08);
    }

    .checkbox.checked {
      background: linear-gradient(135deg, #5b40ff, #7c5cff);
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(91, 64, 255, 0.4);
    }

    .checkbox.checked svg {
      opacity: 1;
    }

    .checkbox svg {
      width: 10px;
      height: 10px;
      stroke: white;
      stroke-width: 2.5;
      opacity: 0;
      transition: opacity 0.1s;
    }

    /* Todo text */
    .todo-text {
      flex: 1;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: -0.1px;
      line-height: 1.4;
      word-break: break-word;
      transition: color 0.2s;
      outline: none;
      cursor: text;
    }

    .todo-text.done {
      color: rgba(255, 255, 255, 0.25);
      text-decoration: line-through;
      text-decoration-color: rgba(255, 255, 255, 0.15);
    }

    /* Priority dot */
    .priority {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      opacity: 0.7;
    }

    /* Delete button */
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.15s;
      color: rgba(255, 255, 255, 0.3);
    }

    .todo-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: rgba(255, 60, 60, 0.1);
      color: rgba(255, 80, 80, 0.7);
    }

    .delete-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
    }

    /* Footer */
    .footer {
      padding: 14px 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .footer-info {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 0.1px;
    }

    .clear-btn {
      background: none;
      border: none;
      font-size: 11px;
      font-family: inherit;
      color: rgba(255, 80, 80, 0.4);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
      letter-spacing: 0.1px;
    }

    .clear-btn:hover {
      background: rgba(255, 60, 60, 0.08);
      color: rgba(255, 80, 80, 0.7);
    }

    .clear-btn:disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="title">
          <div class="title-icon">
            <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
            </svg>
          </div>
          My Tasks
        </div>
        <div class="stats">
          <span class="badge badge-done" id="done-badge">0 done</span>
          <span class="badge badge-total" id="total-badge">0 total</span>
        </div>
      </div>

      <div class="input-wrap">
        <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <input type="text" id="todo-input" placeholder="새 할 일 추가..." maxlength="100" />
        <button class="add-btn" id="add-btn" title="추가 (Enter)">
          <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 01-4 4H4"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행 중</button>
      <button class="filter-btn" data-filter="done">완료</button>
    </div>

    <!-- List -->
    <div class="todo-list" id="todo-list"></div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-info" id="footer-info">Enter 키로 빠르게 추가</span>
      <button class="clear-btn" id="clear-btn" disabled>완료 항목 삭제</button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('linear-todos') || '[]');
    let filter = 'all';

    const listEl = document.getElementById('todo-list');
    const inputEl = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const clearBtn = document.getElementById('clear-btn');
    const totalBadge = document.getElementById('total-badge');
    const doneBadge = document.getElementById('done-badge');
    const footerInfo = document.getElementById('footer-info');

    const PRIORITY_COLORS = ['#5b40ff', '#34c759', '#ff9f0a', '#ff453a'];

    function save() {
      localStorage.setItem('linear-todos', JSON.stringify(todos));
    }

    function getFiltered() {
      if (filter === 'active') return todos.filter(t => !t.done);
      if (filter === 'done') return todos.filter(t => t.done);
      return todos;
    }

    function render() {
      const filtered = getFiltered();
      const doneCount = todos.filter(t => t.done).length;

      totalBadge.textContent = `${todos.length} total`;
      doneBadge.textContent = `${doneCount} done`;
      clearBtn.disabled = doneCount === 0;
      footerInfo.textContent = todos.length === 0
        ? 'Enter 키로 빠르게 추가'
        : `${todos.length - doneCount}개 남음`;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty">
            <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/>
            </svg>
            <p>${filter === 'done' ? '완료된 항목이 없습니다' : filter === 'active' ? '진행 중인 항목이 없습니다' : '할 일을 추가해보세요'}</p>
          </div>`;
        return;
      }

      listEl.innerHTML = filtered.map((todo, i) => {
        const realIdx = todos.indexOf(todo);
        const color = PRIORITY_COLORS[realIdx % PRIORITY_COLORS.length];
        return `
        <div class="todo-item" data-id="${todo.id}">
          <div class="checkbox ${todo.done ? 'checked' : ''}" data-action="toggle" data-id="${todo.id}">
            <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <span
            class="todo-text ${todo.done ? 'done' : ''}"
            contenteditable="true"
            spellcheck="false"
            data-action="edit"
            data-id="${todo.id}"
          >${escapeHtml(todo.text)}</span>
          <div class="priority" style="background:${color}"></div>
          <button class="delete-btn" data-action="delete" data-id="${todo.id}" title="삭제">
            <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </div>`;
      }).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function addTodo() {
      const text = inputEl.value.trim();
      if (!text) return;
      todos.unshift({ id: Date.now(), text, done: false });
      inputEl.value = '';
      save();
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) { todo.done = !todo.done; save(); render(); }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    function editTodo(id, text) {
      const todo = todos.find(t => t.id === id);
      if (todo && text.trim()) { todo.text = text.trim(); save(); }
      else if (todo && !text.trim()) { deleteTodo(id); }
    }

    // Event delegation
    listEl.addEventListener('click', e => {
      const action = e.target.closest('[data-action]');
      if (!action) return;
      const id = parseInt(action.dataset.id);
      if (action.dataset.action === 'toggle') toggleTodo(id);
      if (action.dataset.action === 'delete') deleteTodo(id);
    });

    listEl.addEventListener('blur', e => {
      const el = e.target.closest('[data-action="edit"]');
      if (!el) return;
      const id = parseInt(el.dataset.id);
      editTodo(id, el.innerText);
    }, true);

    listEl.addEventListener('keydown', e => {
      if (e.target.dataset.action === 'edit' && e.key === 'Enter') {
        e.preventDefault();
        e.target.blur();
      }
    });

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filter = btn.dataset.filter;
        render();
      });
    });

    addBtn.addEventListener('click', addTodo);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

    clearBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
