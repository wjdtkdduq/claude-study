<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Background glow */
    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(91, 64, 255, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .calculator {
      width: 340px;
      background: rgba(16, 16, 26, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 24px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 32px 80px rgba(0, 0, 0, 0.6),
        0 8px 24px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      position: relative;
    }

    /* Top bar decoration */
    .calculator::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(91, 64, 255, 0.8), transparent);
    }

    /* Display */
    .display {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px 20px 16px;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 6px;
      overflow: hidden;
    }

    .expression {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.25);
      min-height: 18px;
      word-break: break-all;
      text-align: right;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }

    .result {
      font-size: 40px;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: -1.5px;
      word-break: break-all;
      text-align: right;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .result.small {
      font-size: 28px;
    }

    /* Button grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      height: 62px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: -0.2px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.1s;
      background: rgba(255, 255, 255, 0.08);
    }

    button:active::after {
      opacity: 1;
    }

    button:active {
      transform: scale(0.95);
    }

    /* Number buttons */
    .btn-num {
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-num:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Operator buttons */
    .btn-op {
      background: rgba(91, 64, 255, 0.12);
      color: rgba(139, 114, 255, 0.95);
      border: 1px solid rgba(91, 64, 255, 0.2);
    }

    .btn-op:hover {
      background: rgba(91, 64, 255, 0.2);
      border-color: rgba(91, 64, 255, 0.35);
      color: #a78fff;
    }

    /* Function buttons (AC, +/-, %) */
    .btn-fn {
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 14px;
    }

    .btn-fn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.8);
    }

    /* Equals button */
    .btn-eq {
      background: linear-gradient(135deg, #5b40ff 0%, #7c5cff 100%);
      color: #ffffff;
      border: 1px solid rgba(91, 64, 255, 0.5);
      box-shadow: 0 4px 20px rgba(91, 64, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.15);
      font-size: 18px;
      font-weight: 300;
    }

    .btn-eq:hover {
      background: linear-gradient(135deg, #6b50ff 0%, #8c6cff 100%);
      box-shadow: 0 6px 28px rgba(91, 64, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    /* Zero button spans 2 columns */
    .span-2 {
      grid-column: span 2;
    }

    /* Error state */
    .result.error {
      font-size: 22px;
      color: rgba(255, 80, 80, 0.85);
    }

    /* Keypress flash */
    @keyframes flash {
      0% { background-color: rgba(91, 64, 255, 0.15); }
      100% { background-color: transparent; }
    }

    .btn-pressed {
      animation: flash 0.2s ease-out;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-fn" data-action="clear">AC</button>
      <button class="btn-fn" data-action="sign">+/−</button>
      <button class="btn-fn" data-action="percent">%</button>
      <button class="btn-op" data-action="operator" data-value="÷">÷</button>

      <button class="btn-num" data-action="number" data-value="7">7</button>
      <button class="btn-num" data-action="number" data-value="8">8</button>
      <button class="btn-num" data-action="number" data-value="9">9</button>
      <button class="btn-op" data-action="operator" data-value="×">×</button>

      <button class="btn-num" data-action="number" data-value="4">4</button>
      <button class="btn-num" data-action="number" data-value="5">5</button>
      <button class="btn-num" data-action="number" data-value="6">6</button>
      <button class="btn-op" data-action="operator" data-value="−">−</button>

      <button class="btn-num" data-action="number" data-value="1">1</button>
      <button class="btn-num" data-action="number" data-value="2">2</button>
      <button class="btn-num" data-action="number" data-value="3">3</button>
      <button class="btn-op" data-action="operator" data-value="+">+</button>

      <button class="btn-num span-2" data-action="number" data-value="0">0</button>
      <button class="btn-num" data-action="decimal">.</button>
      <button class="btn-eq" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');

    let current = '0';
    let previous = null;
    let operator = null;
    let shouldReset = false;
    let expression = '';

    function updateDisplay() {
      resultEl.textContent = formatNumber(current);
      resultEl.className = 'result';
      if (current.length > 10) resultEl.classList.add('small');
      expressionEl.textContent = expression;
    }

    function formatNumber(num) {
      if (num === 'Error') return 'Error';
      const parsed = parseFloat(num);
      if (isNaN(parsed)) return num;
      // Limit decimal display
      const str = parseFloat(parsed.toPrecision(12)).toString();
      return str;
    }

    function handleNumber(val) {
      if (shouldReset) {
        current = val;
        shouldReset = false;
      } else {
        if (current === '0' && val !== '.') {
          current = val;
        } else {
          if (current.length >= 12) return;
          current += val;
        }
      }
      updateDisplay();
    }

    function handleDecimal() {
      if (shouldReset) {
        current = '0.';
        shouldReset = false;
        updateDisplay();
        return;
      }
      if (!current.includes('.')) {
        current += '.';
        updateDisplay();
      }
    }

    function handleOperator(op) {
      if (operator && !shouldReset) {
        calculate();
      }
      previous = current;
      operator = op;
      shouldReset = true;
      expression = `${formatNumber(previous)} ${op}`;
      updateDisplay();
    }

    function calculate() {
      if (!operator || previous === null) return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result;
      switch (operator) {
        case '+': result = a + b; break;
        case '−': result = a - b; break;
        case '×': result = a * b; break;
        case '÷':
          if (b === 0) { current = 'Error'; expression = ''; operator = null; previous = null; updateDisplay(); return; }
          result = a / b;
          break;
        default: return;
      }
      expression = `${formatNumber(previous)} ${operator} ${formatNumber(current)} =`;
      current = parseFloat(result.toPrecision(12)).toString();
      operator = null;
      previous = null;
      shouldReset = true;
      updateDisplay();
    }

    function handleClear() {
      current = '0';
      previous = null;
      operator = null;
      shouldReset = false;
      expression = '';
      updateDisplay();
    }

    function handleSign() {
      if (current === '0' || current === 'Error') return;
      current = current.startsWith('-') ? current.slice(1) : '-' + current;
      updateDisplay();
    }

    function handlePercent() {
      const val = parseFloat(current);
      if (isNaN(val)) return;
      current = (val / 100).toString();
      updateDisplay();
    }

    // Button clicks
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const { action, value } = btn.dataset;
        btn.classList.remove('btn-pressed');
        void btn.offsetWidth;
        btn.classList.add('btn-pressed');

        switch (action) {
          case 'number': handleNumber(value); break;
          case 'decimal': handleDecimal(); break;
          case 'operator': handleOperator(value); break;
          case 'equals': calculate(); break;
          case 'clear': handleClear(); break;
          case 'sign': handleSign(); break;
          case 'percent': handlePercent(); break;
        }
      });
    });

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') handleNumber(e.key);
      else if (e.key === '.') handleDecimal();
      else if (e.key === '+') handleOperator('+');
      else if (e.key === '-') handleOperator('−');
      else if (e.key === '*') handleOperator('×');
      else if (e.key === '/') { e.preventDefault(); handleOperator('÷'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') handleClear();
      else if (e.key === 'Backspace') {
        if (current.length > 1 && current !== 'Error') {
          current = current.slice(0, -1);
          updateDisplay();
        } else {
          current = '0';
          updateDisplay();
        }
      }
    });

    updateDisplay();
  </script>
</body>
</html>
